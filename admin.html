<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>গ্রাম্য উপহার: অ্যাডমিন প্যানেল</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#166534;--g2:#15803d;--g3:#dcfce7;--gd:#0f4d27;--bg:#f2f6f3;--card:#fff;--tx:#18241c;--mu:#667a6d;--bd:#e1e9e3;--red:#dc2626;--amb:#d97706;--blu:#2563eb;--pur:#7c3aed;--r:14px;--sh:0 1px 3px rgba(20,60,35,.08)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Hind Siliguri',system-ui,'Noto Sans Bengali','Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--gd),var(--g2))}
.lbox{background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.lbox h1{margin:8px 0 2px;font-size:22px;text-align:center}.lbox p{margin:0 0 18px;text-align:center;color:var(--mu)}
.logo{width:54px;height:54px;border-radius:16px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:28px;margin:0 auto}
/* layout */
#app{display:flex;min-height:100vh}
aside{width:250px;background:linear-gradient(180deg,var(--gd),var(--g));color:#d9f0e0;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40;transition:transform .25s}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px;color:#fff;font-weight:700;font-size:18px}
.brand .logo{width:38px;height:38px;font-size:20px;margin:0;background:rgba(255,255,255,.16);border-radius:11px}
nav{flex:1;overflow:auto;padding:4px 10px}
nav a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;color:#d9f0e0;text-decoration:none;margin-bottom:2px;font-weight:500}
nav a:hover{background:rgba(255,255,255,.09)}nav a.on{background:#fff;color:var(--g);font-weight:700}
nav a svg{width:19px;height:19px;flex:none}
nav .bdg{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:12px;padding:0 7px;line-height:20px}
.sfoot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.14);font-size:13px}
.sfoot button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:9px;padding:8px 12px;width:100%;margin-top:8px}
main{margin-left:250px;flex:1;min-width:0}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:12px 22px}
header h2{margin:0;font-size:20px;flex:1}
#menuBtn{display:none;background:var(--g3);border:0;border-radius:10px;width:40px;height:40px;color:var(--g)}
.hbtn{background:var(--g3);color:var(--g);border:0;border-radius:10px;padding:8px 14px;font-weight:600}
#shade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
.wrap{padding:22px}
/* ui */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font-size:13px;color:var(--g2);font-weight:600;cursor:pointer;background:none;border:0}
.grid{display:grid;gap:16px}
.g6{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}
.g2{grid-template-columns:2fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g2e{grid-template-columns:1fr 1fr}
.stat{display:flex;gap:12px;align-items:center}
.stat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.stat .ic svg{width:22px;height:22px}
.stat b{display:block;font-size:22px;line-height:1.2}.stat span{color:var(--mu);font-size:13px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--g2)}.btn.sec{background:#fff;color:var(--g);border:1px solid var(--bd)}.btn.red{background:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
input,select,textarea{border:1px solid var(--bd);border-radius:10px;padding:9px 11px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #86efac;border-color:var(--g2)}
.bar input,.bar select{width:auto;min-width:130px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:middle;white-space:nowrap}
th{background:#f6faf7;font-size:13px;color:var(--mu);font-weight:600}
tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}tbody tr.clk:hover{background:#f6faf7}
td.wr{white-space:normal;min-width:160px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600}
.p-new{background:#dbeafe;color:#1d4ed8}.p-conf{background:#fef3c7;color:#b45309}.p-ship{background:#ede9fe;color:#6d28d9}.p-done{background:#dcfce7;color:#15803d}.p-can{background:#fee2e2;color:#b91c1c}
.p-ok{background:#dcfce7;color:#15803d}.p-low{background:#fef3c7;color:#b45309}.p-out{background:#fee2e2;color:#b91c1c}.p-off{background:#e5e7eb;color:#4b5563}
.thumb{width:42px;height:42px;border-radius:10px;object-fit:cover;background:var(--g3);display:grid;place-items:center;color:var(--g);font-weight:700}
.mini{display:flex;flex-direction:column;gap:10px}
.mi{display:flex;gap:10px;align-items:center;font-size:14px}.mi .t{flex:1;min-width:0}.mi .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mi .t small{color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:22px 8px}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qa button{background:var(--g3);color:var(--g);border:0;border-radius:12px;padding:14px 8px;font-weight:600}
.sw{display:flex;gap:12px;align-items:center}.sw>*{flex:none}
/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none}
.ov.on{display:block}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:61;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drw.on{transform:none}
.drw .hd{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd)}.drw .hd h3{margin:0;flex:1;font-size:18px}
.drw .bd{flex:1;overflow:auto;padding:4px 18px 18px}.drw .ft{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--bd)}.drw .ft .btn{flex:1;justify-content:center}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--mu)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{border:2px dashed #b9d8c3;border-radius:12px;padding:16px;text-align:center;color:var(--mu);cursor:pointer;background:#f8fcf9}
.up img{max-width:100%;max-height:150px;border-radius:10px;display:block;margin:0 auto 8px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px}.chk input{width:auto}
.det dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:0}.det dt{color:var(--mu)}.det dd{margin:0;word-break:break-word}
.tot td{font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#18241c;color:#fff;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}#toast.bad{background:var(--red)}
.err{color:var(--red);min-height:20px;margin-top:8px;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
svg text{font-family:inherit}
.ld{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;place-items:center;z-index:90;font-weight:700;color:var(--g)}.ld.on{display:grid}
/* print */
#pr{position:fixed;left:0;top:0;width:794px;background:#fff;color:#000;padding:24px;z-index:-1;font-size:13px;display:none}
#pr h1{font-size:20px;margin:0 0 4px}#pr .sub{color:#555;margin-bottom:12px}
#pr table{min-width:0;width:100%;border:1px solid #999}#pr th,#pr td{border:1px solid #bbb;padding:5px 7px;white-space:normal;font-size:12px}#pr th{background:#e8f3ec;color:#000}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important;position:static;width:auto;z-index:auto}}
@media(max-width:1100px){.g2,.g3{grid-template-columns:1fr 1fr}.g2e{grid-template-columns:1fr}}
@media(max-width:860px){aside{transform:translateX(-100%)}aside.on{transform:none}#shade.on{display:block}main{margin-left:0}#menuBtn{display:grid}.wrap{padding:14px}header{padding:10px 14px}.g2,.g3,.g2e{grid-template-columns:1fr}.g6{grid-template-columns:1fr 1fr}.stat b{font-size:19px}.row2{grid-template-columns:1fr}.hbtn span{display:none}}
</style>
</head>
<body>

<div id="login">
  <form class="lbox" id="lf">
    <div class="logo">🌾</div>
    <h1>গ্রাম্য উপহার</h1><p>অ্যাডমিন প্যানেলে প্রবেশ</p>
    <label for="pw" style="margin-top:0">পাসওয়ার্ড</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="আপনার পাসওয়ার্ড">
    <div class="err" id="lerr"></div>
    <button class="btn" style="width:100%;justify-content:center;margin-top:6px" id="lbtn">প্রবেশ করুন</button>
  </form>
</div>

<div id="app" class="hide">
  <aside id="side">
    <div class="brand"><div class="logo">🌾</div>গ্রাম্য উপহার</div>
    <nav id="nav"></nav>
    <div class="sfoot">অ্যাডমিন প্যানেল<button id="logout">লগআউট</button></div>
  </aside>
  <div id="shade"></div>
  <main>
    <header>
      <button id="menuBtn" aria-label="মেনু"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h2 id="ttl">ড্যাশবোর্ড</h2>
      <button class="hbtn" id="refresh">↻ <span>রিফ্রেশ</span></button>
    </header>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div class="ov" id="ov"></div>
<div class="drw" id="drw"></div>
<div class="ld" id="ld">অপেক্ষা করুন...</div>
<div id="toast"></div>
<div id="pr"></div>

<script>
/* ===== সেটিংস ===== */
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxp9nivWFC4kS1MT98oy-VaK0ryiEwJdlkdczVMx_dUqL1BNLW3DwESJG9w36RmmiaC/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BN = '০১২৩৪৫৬৭৮৯';
const bn = v => String(v).replace(/\d/g, d => BN[d]);
const num = n => bn(Math.round(Number(n) || 0).toLocaleString('en-US'));
const tk = n => '৳' + num(n);
const MON = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const pad = n => String(n).padStart(2, '0');
const dstr = t => { if (!t) return '-'; const d = new Date(t); return bn(pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear()); };
const tstr = t => { if (!t) return '-'; const d = new Date(t); return dstr(t) + ' ' + bn(pad(d.getHours()) + ':' + pad(d.getMinutes())); };
const dkey = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const safeStore = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} } };

let PW = '', D = {orders: [], products: [], cats: [], coupons: [], ledger: [], partners: [], statuses: []};

/* ===== সার্ভার যোগাযোগ ===== */
async function api(action, data) {
  const body = JSON.stringify({type: 'admin', action, password: PW, data: data || {}});
  let r;
  if (window.google && google.script && google.script.run) {
    r = await new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(new Error(e.message || e))).adminCall(body));
  } else {
    let resp;
    try { resp = await fetch(ENDPOINT, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body}); }
    catch (e) { throw new Error('ইন্টারনেট সংযোগ দেখুন, সার্ভারে যাওয়া যায়নি'); }
    try { r = await resp.json(); } catch (e) { throw new Error('সার্ভারের উত্তর পড়া যায়নি। Apps Script-এ নতুন Code.gs দিয়ে New version ডেপ্লয় করেছেন তো?'); }
  }
  if (!r || !r.ok) throw new Error((r && r.error) || 'কিছু একটা ভুল হয়েছে');
  return r;
}
function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = 'on' + (bad ? ' bad' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2800); }
async function act(action, data, okMsg) {
  $('#ld').classList.add('on');
  try { D = await api(action, data); if (okMsg) toast(okMsg); return true; }
  catch (e) { toast(e.message, true); return false; }
  finally { $('#ld').classList.remove('on'); }
}

/* ===== লগইন ===== */
$('#lf').addEventListener('submit', async e => {
  e.preventDefault(); PW = $('#pw').value; $('#lerr').textContent = ''; $('#lbtn').disabled = true; $('#lbtn').textContent = 'যাচাই হচ্ছে...';
  try { D = await api('login'); safeStore.set('pw', PW); start(); }
  catch (x) { $('#lerr').textContent = x.message; }
  $('#lbtn').disabled = false; $('#lbtn').textContent = 'প্রবেশ করুন';
});
$('#logout').onclick = () => { safeStore.set('pw', null); PW = ''; location.reload(); };
(async () => {
  const p = safeStore.get('pw'); if (!p) return;
  PW = p; try { D = await api('login'); start(); } catch (e) { PW = ''; safeStore.set('pw', null); }
})();
function start() { $('#login').classList.add('hide'); $('#app').classList.remove('hide'); route(); }

/* ===== আইকন ও মেনু ===== */
const IC = {
  dash: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  box: '<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',
  tag: '<path d="M20 12l-8 8-9-9V3h8zM7.5 7.5h.01"/>',
  cart: '<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.7 12.4a1 1 0 001 .8h9.3a1 1 0 001-.8L21 7H6"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 010 7M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/>',
  alert: '<path d="M12 3l10 18H2zM12 10v5M12 18h.01"/>',
  coupon: '<path d="M3 9a2 2 0 002-2V5h14v2a2 2 0 002 2v6a2 2 0 00-2 2v2H5v-2a2 2 0 00-2-2zM14 6v12" stroke-dasharray="2 2"/>',
  chart: '<path d="M3 3v18h18M7 15l4-5 3 3 5-7"/>',
  book: '<path d="M4 4h12a3 3 0 013 3v13H7a3 3 0 01-3-3zM8 9h7M8 13h5"/>',
  money: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>'
};
const ico = (k, c) => `<svg viewBox="0 0 24 24" fill="none" stroke="${c || 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const MENU = [['dashboard','ড্যাশবোর্ড','dash'],['products','পণ্য ব্যবস্থাপনা','box'],['categories','ক্যাটাগরি','tag'],['orders','অর্ডার ব্যবস্থাপনা','cart'],['customers','গ্রাহক ব্যবস্থাপনা','users'],['inventory','ইনভেন্টরি সতর্কতা','alert'],['ledger','হিসাব খাতা','book'],['coupons','কুপন ব্যবস্থাপনা','coupon'],['analytics','বিক্রয় বিশ্লেষণ','chart']];

/* ===== হিসাব ===== */
const live = o => o.status !== 'বাতিল';
const catName = id => (D.cats.find(c => c.id === id) || {}).name || '-';
function stockState(p) { return p.stock <= 0 ? ['out', 'স্টক শেষ'] : p.stock <= p.low ? ['low', 'কম স্টক'] : ['ok', 'পর্যাপ্ত']; }
const stCls = s => ({'নতুন':'new','কনফার্ম':'conf','পাঠানো হয়েছে':'ship','ডেলিভারি সম্পন্ন':'done','বাতিল':'can'}[s] || 'new');
const pill = s => `<span class="pill p-${stCls(s)}">${esc(s)}</span>`;
function customers() {
  const m = {};
  D.orders.slice().sort((a, b) => a.at - b.at).forEach(o => {
    const c = m[o.phone] || (m[o.phone] = {phone: o.phone, name: o.name, address: o.address, first: o.at, last: o.at, n: 0, spent: 0});
    c.name = o.name; c.address = o.address; c.last = o.at; c.n++; if (live(o)) c.spent += o.total;
  });
  return Object.values(m).sort((a, b) => b.last - a.last);
}
function lines(o) {
  if (o.items && o.items.length) return o.items.map(i => ({name: i.name, size: i.size, qty: i.qty, line: i.line, id: i.id}));
  return String(o.text || '').split('\n').map(l => { const m = l.match(/^'?(.*) \((.*)\) x (\d+) = (\d+)/); return m ? {name: m[1], size: m[2], qty: +m[3], line: +m[4]} : null; }).filter(Boolean);
}
const lowList = () => D.products.filter(p => p.active && p.stock <= p.low).sort((a, b) => a.stock - b.stock);
function inRange(days) { if (!days) return D.orders; const from = Date.now() - days * 864e5; return D.orders.filter(o => o.at >= from); }

/* ===== চার্ট (SVG) ===== */
const COL = ['#15803d', '#2563eb', '#d97706', '#7c3aed', '#dc2626', '#0891b2'];
function lineChart(pts, h) { // pts: [{l, v}]
  h = h || 220; const W = 640, pl = 46, pb = 26, pt = 10, pr = 10;
  const max = Math.max(1, ...pts.map(p => p.v)), step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / step) * step;
  const x = i => pl + (pts.length < 2 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (pts.length - 1)), y = v => pt + (h - pt - pb) * (1 - v / top);
  let g = '';

function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onerror = () => rej(new Error('ছবিটি পড়া যায়নি'));
    img.onload = () => {
      let w = 480, q = .78, out = '';
      for (let i = 0; i < 6; i++) {
        const sc = Math.min(1, w / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q); if (out.length < 45000) break; w *= .8; q -= .06;
      }
      URL.revokeObjectURL(u); out.length < 48000 ? res(out) : rej(new Error('ছবিটি অনেক বড়, অন্য ছবি দিন'));
    };
    img.src = u;
  });
}

/* ===== হিসাব খাতা ===== */
const LT = {purchase: 'ক্রয় (মাল কেনা)', supplier_pay: 'বিক্রেতাকে টাকা দেওয়া', credit_sale: 'বিক্রি (বাকি/নগদ)', collect: 'ক্রেতার কাছে আদায়', expense: 'খরচ'};
const LCLS = {purchase: 'conf', supplier_pay: 'ship', credit_sale: 'done', collect: 'new', expense: 'can'};
const OUTT = ['purchase', 'supplier_pay', 'expense'];
const pname = id => (D.partners.find(p => p.id === id) || {}).name || '-';
function acct() {
  const sup = {}, cus = {}; let purchases = 0, expenses = 0, manual = 0, cin = 0, cout = 0;
  D.ledger.forEach(e => {
    if (e.type === 'purchase') { const x = sup[e.party] || (sup[e.party] = {name: e.party, total: 0, paid: 0}); x.total += e.total; x.paid += e.amount; purchases += e.total; cout += e.amount; }
    else if (e.type === 'supplier_pay') { const x = sup[e.party] || (sup[e.party] = {name: e.party, total: 0, paid: 0}); x.paid += e.amount; cout += e.amount; }

  <div class="grid g6"><div class="card stat"><div class="ic" style="background:#dcfce7">${ico('money', '#15803d')}</div><div><b>${tk(rev)}</b><span>মোট বিক্রি</span></div></div><div class="card stat"><div class="ic" style="background:#dbeafe">${ico('cart', '#2563eb')}</div><div><b>${bn(L.length)}</b><span>সফল অর্ডার</span></div></div><div class="card stat"><div class="ic" style="background:#ede9fe">${ico('chart', '#7c3aed')}</div><div><b>${tk(L.length ? rev / L.length : 0)}</b><span>গড় অর্ডার মূল্য</span></div></div><div class="card stat"><div class="ic" style="background:#fef3c7">${ico('coupon', '#d97706')}</div><div><b>${tk(disc)}</b><span>কুপন ছাড়</span></div></div><div class="card stat"><div class="ic" style="background:#fee2e2">${ico('alert', '#dc2626')}</div><div><b>${bn(can)}%</b><span>বাতিলের হার</span></div></div></div>
  <div class="card" style="margin-top:16px"><h3>দৈনিক বিক্রির ধারা</h3>${lineChart(trend(Math.min(days, 90)), 240)}</div>
  <div class="grid g2e" style="margin-top:16px"><div class="card"><h3>পণ্যভিত্তিক বিক্রি</h3>${hbars(tp.slice(0, 8).map(t => ({l: t.l, v: t.v})), tk)}</div><div class="card"><h3>ক্যাটাগরিভিত্তিক বিক্রি</h3>${hbars(Object.entries(cat).map(([l, v]) => ({l, v})).sort((a, b) => b.v - a.v), tk)}</div>
  <div class="card"><h3>পেমেন্ট পদ্ধতি</h3>${hbars(Object.entries(pay).map(([l, v]) => ({l, v})).sort((a, b) => b.v - a.v), tk)}</div><div class="card"><h3>অর্ডারের অবস্থা</h3>${donut(statusParts())}</div></div>`;
  $('#rg').onchange = e => { range = +e.target.value; route(); };
};
</script>
